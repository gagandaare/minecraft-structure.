<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#183c2b">
<title>Minecraft Structures Explorer</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#101914;color:#f3f5f2;
font-family:system-ui,Arial,sans-serif}
header{padding:24px 18px;background:#183c2b}
h1{margin:0 0 8px;font-size:26px}
p{line-height:1.5}
main{max-width:850px;margin:auto;padding:18px}
input,button{font:inherit;border-radius:10px;padding:12px}
input{width:100%;background:#202c24;color:white;
border:1px solid #526455;margin:10px 0 14px}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{background:#29382d;color:white;border:1px solid #526455}
button.active,button:hover{background:#326c43}
#grid{display:grid;grid-template-columns:
repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-top:18px}
.card{background:#1b2720;border:1px solid #34483a;
border-radius:14px;padding:15px}
.art{font-size:48px;text-align:center;padding:14px}
.card h2{font-size:18px;margin:8px 0}
.card p{font-size:14px;color:#c5d2c7}
.small{font-size:12px;color:#a9b9ac}
footer{text-align:center;padding:24px;color:#a9b9ac}
</style>
</head>
<body>
<header>
  <h1>⛏️ Minecraft Structures</h1>
  <p>Discover places to explore and build.</p>
</header>
<main>
  <h2>Explore structures</h2>
  <input id="search" placeholder="Search structures..."
    aria-label="Search structures">
  <nav id="filters">
    <button class="active" data-cat="All">All</button>
    <button data-cat="Village">Villages</button>
    <button data-cat="Underground">Underground</button>
    <button data-cat="Rare">Rare finds</button>
    <button data-cat="Favorites">♥ Favorites</button>
  </nav>
  <p id="count" class="small"></p>
  <section id="grid"></section>
</main>
<footer>Fan-made Minecraft guide. Not affiliated with Mojang
or Microsoft.</footer>
<script>
const structures = [
 {name:"Village",cat:"Village",art:"🏘️",
  desc:"Explore houses, farms and villagers."},
 {name:"Desert Pyramid",cat:"Rare",art:"🔺",
  desc:"Search the desert for a hidden chamber."},
 {name:"Ancient City",cat:"Underground",art:"🏛️",
  desc:"Explore the deep dark underground."},
 {name:"Stronghold",cat:"Underground",art:"🧱",
  desc:"Discover rooms and the portal room."},
 {name:"Woodland Mansion",cat:"Rare",art:"🏰",
  desc:"Explore a huge woodland structure."},
 {name:"Ocean Monument",cat:"Rare",art:"🌊",
  desc:"Find an underwater monument."},
 {name:"Mineshaft",cat:"Underground",art:"⛏️",
  desc:"Explore old tunnels and minecart tracks."},
 {name:"Pillager Outpost",cat:"Village",art:"🏹",
  desc:"Look for a tower in the overworld."}
];
let category="All";
let favorites=JSON.parse(localStorage.getItem("ms-favs")||"[]");
const grid=document.getElementById("grid");
const search=document.getElementById("search");
function render(){
 const q=search.value.toLowerCase().trim();
 const list=structures.filter(s=>
  (category==="All"||s.cat===category||
   (category==="Favorites"&&favorites.includes(s.name)))&&
  (s.name.toLowerCase().includes(q)||
   s.desc.toLowerCase().includes(q)));
 document.getElementById("count").textContent=
  list.length+" structures found";
 grid.innerHTML="";
 if(!list.length){grid.textContent="No structures found.";return}
 list.forEach(s=>{
  const card=document.createElement("article");
  card.className="card";
  const art=document.createElement("div");
  art.className="art";art.textContent=s.art;
  const title=document.createElement("h2");title.textContent=s.name;
  const desc=document.createElement("p");desc.textContent=s.desc;
  const tag=document.createElement("div");
  tag.className="small";tag.textContent=s.cat;
  const fav=document.createElement("button");
  fav.textContent=favorites.includes(s.name)?"♥ Saved":"♡ Save";
  fav.setAttribute("aria-label","Toggle favorite "+s.name);
  fav.onclick=()=>{
   favorites=favorites.includes(s.name)?
    favorites.filter(n=>n!==s.name):[...favorites,s.name];
   localStorage.setItem("ms-favs",JSON.stringify(favorites));
   render();
  };
  card.append(art,title,desc,tag,fav);grid.append(card);
 });
}
document.querySelectorAll("#filters button").forEach(b=>{
 b.onclick=()=>{
  category=b.dataset.cat;
  document.querySelectorAll("#filters button")
   .forEach(x=>x.classList.toggle("active",x===b));
  render();
 };
});
search.addEventListener("input",render);
render();
</script>
</body>
</html>
